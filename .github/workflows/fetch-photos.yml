name: Fetch farm photos

on:
  push:
    branches: [main]
    paths: [scripts/photos.txt, scripts/fetch-photos.sh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - run: ./scripts/fetch-photos.sh
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git diff --cached --quiet || git commit -m "Add farm photos from Wikimedia Commons"
          git push
